name: .NET

on:
  push:
    branches: [ main, feature/** ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore src/MyDownloadManager.sln
      - name: Build
        run: dotnet build src/MyDownloadManager.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test src/MyDownloadManager.sln --no-build --verbosity normal
